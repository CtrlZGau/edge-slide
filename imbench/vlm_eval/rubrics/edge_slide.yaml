task: edge-slide (T01)
status: DRAFT   # no supplementary rubric in docs/supplementary; written from the paper's App. B.2 text
notes: >-
  S1.R1 is broadened beyond the paper's "too thin" wording: in this sim the plate is 3 cm thick
  but 8-15 cm wide, and the Panda jaws open to at most 8 cm. Either explanation of why a direct
  top-down grasp fails (too thin / flush with no clearance under it, OR too wide for the jaw
  opening while lying flush) counts.

stage1:
  required:
    - id: S1.R1
      text: >-
        States that a direct top-down jaw grasp is infeasible because the plate lies flush on the
        table with no clearance under it (too thin to close around, or too wide for the max jaw opening).
    - id: S1.R2
      text: >-
        States that sliding the plate so it overhangs the table edge exposes a graspable lip
        (or an equivalent valid way to create clearance).
    - id: S1.R3
      text: >-
        States that maintaining contact / downward pressure or friction is a precondition for sliding.
  optional:
    - id: S1.O1
      text: Nearest edge / slide direction.
    - id: S1.O2
      text: Plate size estimate.
    - id: S1.O3
      text: Risk of over-sliding so the plate falls off.
    - id: S1.O4
      text: Side / horizontal pinch orientation for the lip.
    - id: S1.O5
      text: Using F/T (or tactile) feedback to keep contact.
  forbidden:
    - id: S1.F1
      text: Claims a direct top-down grasp works.
    - id: S1.F2
      text: Invents tools or objects that are not in the scene.
    - id: S1.F3
      text: Relies on suction (this is a jaw gripper).

stage2:
  criteria:
    - id: S2.C1
      text: Slides/pushes the plate to overhang the table edge BEFORE grasping.
    - id: S2.C2
      text: Grasps the exposed lip.
    - id: S2.C3
      text: Lifts the plate.
    - id: S2.C4
      text: The steps are in a valid order.
  forbidden:   # same FORBIDDEN items, judged on the plan
    - id: S2.F1
      text: Plan relies on a direct top-down grasp of the flush plate.
    - id: S2.F2
      text: Plan invents tools or objects that are not in the scene.
    - id: S2.F3
      text: Plan relies on suction.

reference:   # paper numbers for edge-slide (%)
  "GPT-5.5": {stage1: 90.0, stage2: 90.0}
  "Claude Sonnet 4.6": {stage1: 90.0, stage2: 90.0}
  "S2-GT": {stage2: 90.0}
